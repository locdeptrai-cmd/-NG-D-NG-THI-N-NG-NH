name: Deploy ATC Exam PWA to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "offline/mobile_flutter/**"
      - ".github/workflows/deploy-pwa.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PWA_BASE_PATH: /-NG-D-NG-THI-N-NG-NH/
  ATC_API_BASE_URL: ${{ vars.ATC_API_BASE_URL }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: offline/mobile_flutter
        run: flutter pub get

      - name: Generate Drift sources
        working-directory: offline/mobile_flutter
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Download SQLite WebAssembly
        working-directory: offline/mobile_flutter
        run: |
          curl -L --fail \
            https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-2.9.4/sqlite3.wasm \
            -o web/sqlite3.wasm

      - name: Compile Drift web worker
        working-directory: offline/mobile_flutter
        run: dart compile js web/drift_worker.dart -o web/drift_worker.js

      - name: Analyze
        working-directory: offline/mobile_flutter
        run: flutter analyze

      - name: Test
        working-directory: offline/mobile_flutter
        run: flutter test

      - name: Build web for GitHub Pages
        working-directory: offline/mobile_flutter
        shell: bash
        run: |
          build_args=(--release --base-href "$PWA_BASE_PATH")
          if [[ -n "$ATC_API_BASE_URL" ]]; then
            build_args+=(--dart-define="ATC_API_BASE_URL=$ATC_API_BASE_URL")
          else
            echo "::warning::ATC_API_BASE_URL is not configured; users can set the HTTPS API URL from the login screen."
          fi
          flutter build web "${build_args[@]}"
          touch build/web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: offline/mobile_flutter/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
