name: Build Mobile Offline (iOS + Android)

on:
  workflow_dispatch:
  push:
    paths:
      - "flutter/**"
      - "dist/offline_exam.db"
      - ".github/workflows/build-mobile-offline.yml"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sync DB and build APK
        working-directory: flutter
        run: |
          if [ -f ../dist/offline_exam.db ]; then
            cp ../dist/offline_exam.db assets/offline_exam.db
          fi
          flutter pub get
          flutter build apk --release \
            --dart-define=ATC_API_BASE_URL=https://atc-exam-api.onrender.com/api
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/ATC_Offline_Mobile_Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: atc-offline-android
          path: dist/ATC_Offline_Mobile_Android.apk
          retention-days: 14

  ios:
    name: Build iOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sync DB
        run: |
          if [ -f dist/offline_exam.db ]; then
            cp dist/offline_exam.db flutter/assets/offline_exam.db
          fi

      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Detect Apple signing secrets
        id: signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build unsigned iOS
        if: steps.signing.outputs.enabled != 'true'
        working-directory: flutter
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=ATC_API_BASE_URL=https://atc-exam-api.onrender.com/api
          mkdir -p ../dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            ../dist/ATC_Offline_Mobile_iOS_unsigned_Runner.app.zip

      - name: Install Apple certificate and provisioning profile
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROVISIONING_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Build signed IPA
        if: steps.signing.outputs.enabled == 'true'
        working-directory: flutter
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.atc.offline.atcOfflineMobile</key>
              <string>${PROVISIONING_PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF
          flutter build ipa --release --export-options-plist=/tmp/ExportOptions.plist
          mkdir -p ../dist
          IPA_PATH="$(find build/ios/ipa -name '*.ipa' | head -n 1)"
          cp "$IPA_PATH" ../dist/ATC_Offline_Mobile_iOS.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: atc-offline-ios
          path: |
            dist/ATC_Offline_Mobile_iOS.ipa
            dist/ATC_Offline_Mobile_iOS_unsigned_Runner.app.zip
          if-no-files-found: warn
          retention-days: 14
