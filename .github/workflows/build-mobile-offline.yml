name: Build Android Offline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flutter/**"
      - "dist/offline_exam.db"
      - ".github/workflows/build-mobile-offline.yml"

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sync DB and build APK
        working-directory: flutter
        run: |
          if [ -f ../dist/offline_exam.db ]; then
            cp ../dist/offline_exam.db assets/offline_exam.db
          fi
          flutter pub get
          flutter build apk --release \
            --dart-define=ATC_API_BASE_URL=https://atc-exam-api.onrender.com/api
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/ATC_Offline_Mobile_Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: atc-offline-android
          path: dist/ATC_Offline_Mobile_Android.apk
          retention-days: 14
