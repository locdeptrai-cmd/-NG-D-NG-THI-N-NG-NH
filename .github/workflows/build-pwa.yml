name: Build ATC Exam PWA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "offline/mobile_flutter/**"
      - ".github/workflows/build-pwa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: offline/mobile_flutter
        run: flutter pub get

      - name: Generate Drift sources
        working-directory: offline/mobile_flutter
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Download SQLite WebAssembly
        working-directory: offline/mobile_flutter
        run: |
          curl -L --fail \
            https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-2.9.4/sqlite3.wasm \
            -o web/sqlite3.wasm

      - name: Compile Drift web worker
        working-directory: offline/mobile_flutter
        run: dart compile js web/drift_worker.dart -o web/drift_worker.js

      - name: Analyze
        working-directory: offline/mobile_flutter
        run: flutter analyze

      - name: Test
        working-directory: offline/mobile_flutter
        run: flutter test

      - name: Build web
        working-directory: offline/mobile_flutter
        run: flutter build web --release

      - name: Upload PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: atc-exam-pwa
          path: offline/mobile_flutter/build/web
          retention-days: 14
