services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: examdb
      POSTGRES_USER: examuser
      POSTGRES_PASSWORD: examsecret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: ./online
    command: sh -c "python manage.py migrate && bash scripts/render_initial_data.sh && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: docker-development-secret-change-before-production
      POSTGRES_DB: examdb
      POSTGRES_USER: examuser
      POSTGRES_PASSWORD: examsecret
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./online:/app

volumes:
  pgdata:
