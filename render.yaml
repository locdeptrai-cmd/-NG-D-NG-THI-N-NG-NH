services:
  - type: web
    name: atc-exam-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: bash build.sh
    startCommand: bash start.sh
    initialDeployHook: bash scripts/render_initial_data.sh
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atc-exam-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://locdeptrai-cmd.github.io
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://locdeptrai-cmd.github.io,https://*.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: atc-exam-db
    plan: free
    region: singapore
    databaseName: atc_exam
    user: atc_exam
    postgresMajorVersion: "18"
    ipAllowList: []
