name: atc_offline_mobile

description: Offline-first ATC Exam PWA for web, iOS, Android and desktop
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.4
  dio: ^5.7.0
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^14.8.1
  intl: ^0.20.2
  path: ^1.9.0
  shared_preferences: ^2.5.3
  sqlite3_flutter_libs: ^0.5.32
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  drift_dev: ^2.26.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/questions.json
