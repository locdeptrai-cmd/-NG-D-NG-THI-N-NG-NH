{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin: 20px auto;">
  <h3>Đăng nhập</h3>
  <form method="post">
    {% csrf_token %}
    <p><input type="text" name="username" placeholder="Tài khoản" required style="width:100%;" /></p>
    <p><input type="password" name="password" placeholder="Mật khẩu" required style="width:100%;" /></p>
    <button class="btn" type="submit">Đăng nhập</button>
  </form>
</div>
{% endblock %}
